<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
<script defer src="content.js"></script>
<script defer src="engine.js"></script>
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --soft:#F6F8FB; --ink:#17202D; --muted:#5A6779; --rule:#D3DAE3;
  --accent:#1f4e79; --accent-soft:#E3ECF5; --ok:#1E7A4F; --ok-soft:#E3F3EA; --bad:#A8392F; --bad-soft:#FBEAE7; --warn:#8A6100; --warn-soft:#FBF2DC;
  --f-display:'Literata', Georgia, serif;
  --f-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141A; --panel:#171D25; --soft:#1D242E; --ink:#E3E8EE; --muted:#93A0B1; --rule:#2E3845;
    --accent:#7FAAD8; --accent-soft:#1D2D40; --ok:#5CC28E; --ok-soft:#16291F; --bad:#EE8577; --bad-soft:#2E1A18; --warn:#E3B54F; --warn-soft:#2D2412; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141A; --panel:#171D25; --soft:#1D242E; --ink:#E3E8EE; --muted:#93A0B1; --rule:#2E3845;
  --accent:#7FAAD8; --accent-soft:#1D2D40; --ok:#5CC28E; --ok-soft:#16291F; --bad:#EE8577; --bad-soft:#2E1A18; --warn:#E3B54F; --warn-soft:#2D2412; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:24px 20px 56px}
@media (max-width:820px){.layout{grid-template-columns:1fr;padding:16px 16px 48px}}
/* sidebar */
nav.side{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;font-size:14px}
@media (max-width:820px){nav.side{position:static;max-height:none;order:2;border-top:1px solid var(--rule);padding-top:16px}}
.side-head{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.side-head a{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--ink);text-decoration:none}
.side-head span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side-links{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.side-links a{font-size:13px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--panel)}
.side-links a.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.mod{border-top:1px solid var(--rule);padding:8px 0}
.mod > a,.mod > span{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);font-weight:500}
.mod .num{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px;flex:none}
.mod.planned > span{color:var(--muted);font-weight:400}
.mod.planned .soon{font-size:10px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;margin-left:auto;color:var(--muted)}
.mod ul{list-style:none;margin:6px 0 0 26px;padding:0;display:flex;flex-direction:column;gap:2px}
.mod li a{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-radius:5px;text-decoration:none;color:var(--muted)}
.mod li a:hover{background:var(--soft);color:var(--ink)}
.mod li a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mod li .prog{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.mod li .prog.done{color:var(--ok)}
/* main */
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
.lead{color:var(--muted);margin:8px 0 0;max-width:72ch}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
@media (max-width:600px){.card{padding:16px}}
.concept p{margin:0 0 12px;max-width:74ch}
.concept p:last-child{margin-bottom:0}
.concept ul,.concept ol{margin:0 0 12px;padding-left:22px;max-width:72ch}
.concept li{margin-bottom:4px}
.rulebox{background:var(--soft);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px;margin:0 0 12px;overflow-x:auto}
.example{border:1px dashed var(--rule);border-radius:8px;padding:12px 16px;margin-top:12px;background:var(--soft)}
.example .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.example p{margin:0 0 8px}.example p:last-child{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.chips .lbl{color:var(--muted);margin-right:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);text-decoration:none;font-size:13px}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.ghost{color:var(--muted);border-style:dashed}
/* problems */
.problem{display:flex;flex-direction:column;gap:12px}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.p-head .eyebrow{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--rule);display:inline-block}
.dot.done{background:var(--ok);border-color:var(--ok)}
.prompt{max-width:74ch}
.prompt p{margin:0 0 8px}.prompt p:last-child{margin:0}
.answer-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{font:inherit;font-family:var(--f-mono);font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-width:0;width:240px;max-width:100%}
input[type=text].wide{width:100%;max-width:520px}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] button.primary{color:#0D1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0D1520}}
button.link{border:none;background:none;color:var(--accent);padding:4px 6px;font-size:13.5px}
button.link:hover{text-decoration:underline}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit{font-size:13px;color:var(--muted)}
.math-entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;max-width:820px}
@media (max-width:640px){.math-entry{grid-template-columns:1fr}}
.me-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.me-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.math-entry input[type=text]{width:100%;max-width:none;min-height:52px}
.preview-box{min-height:52px;display:flex;align-items:center;padding:6px 14px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-soft);font-size:19px;overflow-x:auto;overflow-y:hidden;color:var(--ink)}
.preview-box.partial{opacity:.55;border-style:dashed}
.preview-box .ph{font-size:13px;color:var(--muted);font-family:var(--f-body)}
.me-note{font-size:12.5px;color:var(--muted);min-height:1.2em}
.me-note.warn{color:var(--bad)}
.fb{border-radius:8px;padding:10px 14px;font-size:15px;max-width:74ch}
.fb p{margin:0 0 6px}.fb p:last-child{margin:0}
.fb.ok{background:var(--ok-soft);border-left:3px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.fb.info{background:var(--warn-soft);border-left:3px solid var(--warn)}
.fb .h{font-weight:600}
.actions{display:flex;gap:4px;flex-wrap:wrap;margin-left:-6px}
.mc{display:flex;flex-direction:column;gap:6px}
.mc label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;background:var(--soft)}
.mc label:hover{border-color:var(--muted)}
.mc label.picked-bad{border-color:var(--bad);background:var(--bad-soft)}
.mc label.picked-ok{border-color:var(--ok);background:var(--ok-soft)}
.mc input{margin-top:5px;accent-color:var(--accent)}
.steps{border-left:2px solid var(--accent-soft);margin-left:4px;padding-left:16px;display:flex;flex-direction:column;gap:14px}
.steps .s-title{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.step{display:flex;flex-direction:column;gap:8px}
.step.done .answer-row input{border-color:var(--ok)}
.solution{background:var(--soft);border-radius:8px;padding:12px 16px;max-width:74ch;overflow-x:auto}
.solution .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.solution p{margin:0 0 8px}.solution p:last-child{margin:0}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);text-decoration:none;color:var(--ink);max-width:48%}
.pager a span{font-size:12px;color:var(--muted)}
.pager a.next{margin-left:auto;text-align:right}
/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
a.mcard:hover{border-color:var(--accent)}
.mcard .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.mcard h3{font-family:var(--f-display);font-size:17px;font-weight:600}
.mcard p{margin:0;font-size:13.5px;color:var(--muted)}
.mcard.planned{background:transparent;border-style:dashed}
.mcard.planned h3{color:var(--muted)}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--ok)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;font-size:14px}
.howto div{background:var(--soft);border-radius:8px;padding:10px 12px}
.howto b{display:block;margin-bottom:2px}
table.lec{width:100%;border-collapse:collapse;font-size:14px}
table.lec td,table.lec th{text-align:left;padding:10px 8px;border-top:1px solid var(--rule);vertical-align:top}
table.lec th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-top:none}
table.lec td:first-child{font-family:var(--f-mono);color:var(--muted);width:44px}
table.lec td:nth-child(2){width:32%;font-weight:500}
table.lec tr:target td{background:var(--accent-soft)}
@media (max-width:600px){table.lec td:nth-child(2){width:auto}}
.foot{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.chart-wrap{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.chart-wrap svg{width:100%;max-width:560px;height:auto;background:var(--soft);border-radius:8px}
.toggle{display:flex;gap:6px}
.toggle button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}
code{font-family:var(--f-mono);font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:4px}
.noscript{padding:24px}
</style>
</head>
<body>
<div class="layout">
  <nav class="side" id="side" aria-label="Modules"></nav>
  <main id="main"><p class="noscript">Loading the math toolkit…</p></main>
</div>
</body>
</html>
